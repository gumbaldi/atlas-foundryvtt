name: Foundry release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev, test]

permissions:
  contents: read

concurrency:
  group: foundry-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_commit: ${{ steps.update_manifest.outputs.commit }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check version against target branch
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:package.json" > /tmp/base-package.json
          node <<'NODE'
          const base = require('/tmp/base-package.json').version;
          const current = require('./package.json').version;

          function parse(version) {
            if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
              throw new Error(`Expected stable version MAJOR.MINOR.PATCH, got: ${version}`);
            }
            return version.split('.').map(BigInt);
          }

          const oldParts = parse(base);
          const newParts = parse(current);
          const increased = newParts.some((part, i) =>
            part > oldParts[i] && newParts.slice(0, i).every((p, j) => p === oldParts[j])
          );

          if (!increased) {
            throw new Error(`Version must increase: ${base} -> ${current}`);
          }
          console.log(`Version increased: ${base} -> ${current}`);
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Contract typecheck
        run: npm run typecheck:contract

      - name: Contract tests (recorded fixtures)
        run: npm run test:contract

      - name: Build release package
        env:
          ATLAS_FOUNDRY_MANIFEST_URL: https://github.com/gumbaldi/atlas-foundryvtt/releases/latest/download/module.json
          ATLAS_FOUNDRY_DOWNLOAD_URL_TEMPLATE: https://github.com/gumbaldi/atlas-foundryvtt/releases/download/foundry-v{version}/atlas-foundry-v{version}.zip
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/test ]]; then
            VERSION=$(node -p "require('./package.json').version")
            npm pkg set "version=${VERSION}-test.${GITHUB_RUN_NUMBER}"
            export ATLAS_FOUNDRY_MANIFEST_URL="https://github.com/gumbaldi/atlas-foundryvtt/releases/download/foundry-test/module.json"
            export ATLAS_FOUNDRY_DOWNLOAD_URL_TEMPLATE="https://github.com/gumbaldi/atlas-foundryvtt/releases/download/foundry-test/atlas-foundry-v{version}.zip"
          fi
          npm run package

      - name: Update module.json in branch
        id: update_manifest
        if: github.event_name == 'push'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # The test-channel build above rewrites package.json (npm pkg set). Drop
          # those build-time edits so the tree is clean for the rebase below.
          git restore .
          cp release/module.json module.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
   
          git add module.json
   
          if git diff --cached --quiet; then
            echo "module.json is already up to date"
          else
            git commit -m "chore: update Foundry manifest"
            # The branch may have moved while this run was building (e.g. a version bump pushed meanwhile).
            git pull --rebase origin "$BRANCH"
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
   
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload release files
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: foundry-release
          path: |
            release/module.json
            release/atlas-foundry-v*.zip
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.release_commit }}

      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: foundry-release
          path: release

      - name: Create GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")

          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected stable version MAJOR.MINOR.PATCH: $VERSION" >&2
            exit 1
          fi

          gh release create "foundry-v$VERSION" \
            "release/module.json" \
            "release/atlas-foundry-v$VERSION.zip" \
            --target "$(git rev-parse HEAD)" \
            --title "Atlas Foundry v$VERSION" \
            --generate-notes

      - name: Publish test prerelease
        if: github.ref == 'refs/heads/test'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./release/module.json').version")
          if gh release view foundry-test >/dev/null 2>&1; then
            git tag -f foundry-test "$(git rev-parse HEAD)"
            git push --force origin refs/tags/foundry-test
            gh release upload foundry-test "release/atlas-foundry-v$VERSION.zip" --clobber
            gh release upload foundry-test release/module.json --clobber
          else
            gh release create foundry-test "release/atlas-foundry-v$VERSION.zip" release/module.json \
              --target "$(git rev-parse HEAD)" --title "Atlas Foundry Test" --prerelease
          fi
